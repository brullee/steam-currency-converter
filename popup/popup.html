<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>

    <div id="page-main">
        <div class="header-row">
            <h1>Currency Converter</h1>
            <label class="toggle" title="Enable / disable conversion">
                <input type="checkbox" id="conversion-enabled">
                <span class="toggle-track">
                    <span class="toggle-thumb"></span>
                </span>
            </label>
        </div>

        <div id="settings">
            <div id="to-currency-group">
                <label for="to-currency">Convert prices to</label>
                <div class="cc-combobox">
                    <input id="to-currency" placeholder="e.g. JOD, USD, EUR" autocomplete="off" spellcheck="false">
                    <ul id="to-currency-dropdown" hidden></ul>
                </div>
            </div>

            <label for="from-currency">Store currency</label>
            <div class="select-wrapper">
                <select id="from-currency">
                    <option value="" disabled selected>Select Your Currency</option>
                </select>
            </div>

            <label class="checkbox-label">
                <input type="checkbox" id="hover-enabled">
                Show original price on hover
            </label>

            <label class="checkbox-label">
                <input type="checkbox" id="strip-trailing">
                Hide "USD" after prices
                <span class="tooltip-icon">?</span>
            </label>
        </div>

        <button class="link-btn" id="more-btn">More settings</button>
    </div>

    <div id="page-more" hidden>
        <div class="header-row">
            <h1>More Settings</h1>
            <button class="back-btn" id="back-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M14 6 L20 12 L14 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <line x1="20" y1="12" x2="8" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </button>
        </div>

        <label>Formatting for</label>
        <div class="segmented" role="radiogroup" aria-label="Which prices to format">
            <label><input type="radio" name="format-set" value="converted"><span id="format-set-converted">Converted</span></label>
            <label><input type="radio" name="format-set" value="original"><span id="format-set-original">Store currency</span></label>
        </div>

        <hr class="settings-divider">
        <p class="section-heading">Symbol</p>

        <label for="custom-symbol">Currency symbol / text</label>
        <input id="custom-symbol" placeholder="e.g. JD (blank = default)" autocomplete="off" spellcheck="false">

        <label>Position</label>
        <div class="radio-row">
            <label class="radio-label"><input type="radio" name="sym-pos" value="">Default</label>
            <label class="radio-label"><input type="radio" name="sym-pos" value="before">Left</label>
            <label class="radio-label"><input type="radio" name="sym-pos" value="after">Right</label>
        </div>

        <label class="checkbox-label">
            <input type="checkbox" id="sym-space">
            Space between symbol and number
        </label>

        <hr class="settings-divider">
        <p class="section-heading">Number format</p>

        <label for="thou-sep">Thousands separator</label>
        <div class="select-wrapper">
            <select id="thou-sep">
                <option value="">Unchanged</option>
                <option value=".">Period (.)</option>
                <option value=",">Comma (,)</option>
                <option value=" ">Space ( )</option>
                <option value="none">None</option>
            </select>
        </div>

        <label for="dec-sep">Decimal separator</label>
        <div class="select-wrapper">
            <select id="dec-sep">
                <option value="">Unchanged</option>
                <option value=".">Period (.)</option>
                <option value=",">Comma (,)</option>
            </select>
        </div>

        <label class="checkbox-label">
            <input type="checkbox" id="hide-zero-decimals">
            Hide decimals when zero (.00)
        </label>

    </div>

    <div class="save-indicator" role="status" aria-live="polite">
        <svg class="floppy" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true">
            <!-- The shutter and label are cut out of the disk, so the popup shows through. -->
            <mask id="floppy-holes">
                <rect width="16" height="16" fill="#fff"/>
                <rect x="4.5" y="1" width="6" height="4.2" rx=".4" fill="#000"/>
                <rect x="4" y="8.5" width="8" height="5.5" rx=".5" fill="#000"/>
            </mask>
            <path class="floppy-body" mask="url(#floppy-holes)" d="M2.5 1h8.9L15 4.6V14.5a.5.5 0 0 1-.5.5h-12a.5.5 0 0 1-.5-.5v-13a.5.5 0 0 1 .5-.5z"/>
            <rect class="floppy-body" x="8.2" y="1.8" width="1.4" height="2.6"/>
        </svg>
        <span class="save-text">Saved</span>
    </div>

    <script src="../shared/currencies.js"></script>
    <script src="../shared/settings.js"></script>
    <script src="popup.js"></script>
</body>
</html>
