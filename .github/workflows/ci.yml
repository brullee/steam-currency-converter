name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an older, still-running run pointless - cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tests

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      # Runner images ship Google Chrome; the suite loads the packed Chrome build into it.
      - run: npm run test:e2e
        env:
          BROWSER_PATH: /usr/bin/google-chrome
